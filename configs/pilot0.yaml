# Population-DTI-INR v1 — Pilot-0
# 3 train + 1 val + 1 unseen test, 100% DTI observations

hcp_root: "E:/BaiduNetdiskDownload/HCP/3T 146"
trad_root: "E:/BaiduNetdiskDownload/INR/outputs/step1_traditional_dti"

b0_threshold: 50.0
shell_tol: 200.0
dti_shells: [1000.0]

# Physics / normalization (shared by all modes in this package)
b_scale: 1.0
bvec_normalize: true
coordinate_range: [-1.0, 1.0]
signal_normalization: "s0"   # S0-normalized MSE; PSNR uses max_signal
max_signal: 1.0

sampling_fraction: 1.0
sampling_base_seed: 20260822

split:
  train: ["101309", "102715", "103515"]
  val: ["104416"]
  test: ["106319"]

# Model
latent_dim: 16
hidden: 128
layers: 4
pe_freqs: 8

# Population training — formal length for scientific validation (also see configs/phase3_pilot0.yaml)
epochs: 150
full_retrain_epochs: 150
batch_voxels: 4096
lr: 1.0e-3
log_every: 5
seed: 42
device: "auto"
skip_traditional_if_exists: true

# Latent adaptation checkpoints
adapt_iterations: [0, 10, 50, 100, 200]
adapt_lr: 1.0e-3

experiment_tag: "population_dti"
